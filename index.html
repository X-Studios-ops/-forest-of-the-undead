<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Mobile optimization: No zooming, strict full screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Project: NIGHTFALL (RE x MW)</title>
    
    <!-- Tailwind CSS (CDN for quick styling, Vercel handle kar lega) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts: Tactical (Rajdhani) & Horror (Nosifer) -->
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Resident Evil Vibe: Dark Vignette on the edges */
        .horror-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.95), inset 0 0 50px rgba(0, 0, 0, 0.8);
            z-index: 5;
        }

        /* Damage/Blood Overlay */
        .damage-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(150, 0, 0, 0.4) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
            z-index: 6;
        }
        .taking-damage { opacity: 1 !important; }

        /* Tactical Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 10;
        }
        .ch-line { position: absolute; background: rgba(255, 255, 255, 0.8); }
        .ch-top { top: 0; left: 11px; width: 2px; height: 8px; }
        .ch-bottom { bottom: 0; left: 11px; width: 2px; height: 8px; }
        .ch-left { top: 11px; left: 0; width: 8px; height: 2px; }
        .ch-right { top: 11px; right: 0; width: 8px; height: 2px; }
        .ch-dot { top: 11px; left: 11px; width: 2px; height: 2px; background: red; }

        /* Hitmarker (MW Style) */
        .hitmarker { opacity: 0; transition: opacity 0.1s; position: absolute; inset: 0; }
        .hit-active { opacity: 1 !important; }

        /* Mobile Shooter Controls Setup */
        .touch-zone { position: absolute; bottom: 10%; width: 40%; height: 50%; z-index: 20; }
        #left-joystick-zone { left: 5%; }
        #right-aim-zone { right: 5%; }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.3); }

        /* ThreeJS Canvas container */
        #game-canvas { position: absolute; inset: 0; z-index: 1; }
    </style>
    <!-- Mobile Developer Console (Eruda) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

</head>
<body>

    <!-- 1. LOADING SCREEN (Tactical/Dark) -->
    <div id="loading-screen" class="absolute inset-0 bg-black z-[100] flex flex-col items-center justify-center transition-opacity duration-700">
        <h1 class="text-4xl text-red-700 mb-2" style="font-family: 'Nosifer', cursive;">NIGHTFALL</h1>
        <p class="text-gray-400 tracking-[0.3em] text-sm mb-8 animate-pulse">INITIATING TACTICAL PROTOCOL</p>
        <div class="w-64 h-1 bg-gray-800 rounded">
            <div id="loading-bar" class="h-full bg-red-600 w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- 2. MAIN MENU -->
    <div id="main-menu" class="absolute inset-0 bg-black/90 z-[90] hidden flex-col items-center justify-center backdrop-blur-md">
        <h1 class="text-5xl md:text-7xl text-white font-bold tracking-wider mb-2">OPERATION <span class="text-red-600">NIGHTFALL</span></h1>
        <p class="text-gray-400 mb-12 tracking-widest uppercase text-sm">Survival x Warfare</p>
        
        <button id="btn-deploy" class="px-12 py-3 bg-white/10 hover:bg-white/20 border border-white/30 text-white font-bold text-xl uppercase tracking-widest transition-all">
            Deploy
        </button>
    </div>

    <!-- 3. GAME UI (MW x RE HUD) -->
    <div id="game-hud" class="absolute inset-0 z-50 hidden pointer-events-none flex-col justify-between p-6">
        
        <!-- Top: Objective & Radar -->
        <div class="flex justify-between items-start">
            <div class="bg-black/50 border-l-4 border-yellow-500 p-2 px-4 backdrop-blur-sm">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider">Current Objective</p>
                <p class="text-white font-bold text-sm">SURVIVE THE HORDE</p>
            </div>
            <!-- Placeholder for Minimap (MW Style) -->
            <div class="w-24 h-24 bg-green-900/30 border border-green-500/50 rounded-full shadow-[0_0_15px_rgba(34,197,94,0.2)]"></div>
        </div>

        <!-- Center: Crosshair & Hitmarker -->
        <div class="crosshair">
            <div class="ch-line ch-top"></div>
            <div class="ch-line ch-bottom"></div>
            <div class="ch-line ch-left"></div>
            <div class="ch-line ch-right"></div>
            <div class="ch-dot"></div>
            <!-- Hitmarker SVG (Flashes on hit) -->
            <svg id="hitmarker-ui" class="hitmarker w-8 h-8 absolute -top-1 -left-1" viewBox="0 0 100 100">
                <line x1="20" y1="20" x2="40" y2="40" stroke="white" stroke-width="4"/>
                <line x1="80" y1="20" x2="60" y2="40" stroke="white" stroke-width="4"/>
                <line x1="20" y1="80" x2="40" y2="60" stroke="white" stroke-width="4"/>
                <line x1="80" y1="80" x2="60" y2="60" stroke="white" stroke-width="4"/>
            </svg>
        </div>

        <!-- Bottom: Health (RE) & Ammo (MW) -->
        <div class="flex justify-between items-end w-full">
            <!-- Health Status (ECG or Text) -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full border-2 border-green-500 flex items-center justify-center bg-green-900/20 shadow-[0_0_10px_rgba(34,197,94,0.5)]">
                    <span class="text-green-400 font-bold">FINE</span>
                </div>
                <div class="w-40 h-2 bg-gray-800 rounded-r-full overflow-hidden">
                    <div id="health-bar" class="w-full h-full bg-green-500"></div>
                </div>
            </div>

            <!-- Ammo Counter -->
            <div class="text-right">
                <p class="text-gray-400 text-xs uppercase tracking-widest mb-1">Assault Rifle</p>
                <div class="flex items-baseline gap-1">
                    <span id="ammo-current" class="text-5xl text-white font-bold">30</span>
                    <span class="text-2xl text-gray-500">/</span>
                    <span id="ammo-reserve" class="text-xl text-gray-400">120</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. MOBILE CONTROLS (Hidden by default on PC) -->
    <div id="mobile-controls" class="absolute inset-0 z-40 hidden pointer-events-none">
        <!-- Left Side: Movement Joystick Area -->
        <div id="left-joystick-zone" class="touch-zone pointer-events-auto rounded-xl"></div>
        
        <!-- Right Side: Aim Area & Buttons -->
        <div id="right-aim-zone" class="touch-zone pointer-events-auto rounded-xl">
            <button id="btn-shoot" class="action-btn absolute bottom-0 right-0 w-20 h-20 bg-red-600/30 border-red-500 text-xl shadow-[0_0_15px_rgba(220,38,38,0.5)]">FIRE</button>
            <button id="btn-ads" class="action-btn absolute bottom-24 right-16 w-14 h-14">ADS</button>
            <button id="btn-jump" class="action-btn absolute bottom-8 right-24 w-12 h-12 text-sm">JMP</button>
            <button id="btn-crouch" class="action-btn absolute bottom-24 right-0 w-12 h-12 text-sm">CRCH</button>
        </div>
    </div>

    <!-- Effects Layers -->
    <div class="horror-vignette"></div>
    <div id="damage-flash" class="damage-overlay"></div>

    <!-- The 3D Canvas Container -->
    <div id="game-canvas"></div>

    <!-- MAIN LOGIC (Vite uses type="module") -->
    <!-- GitHub/Vercel setup ke liye hamesha module use karna -->
    <script type="module" src="/main.js"></script>

    <!-- Basic UI Toggle Logic -->
    <script>
        // Simulate loading time
        setTimeout(() => {
            document.getElementById('loading-bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('main-menu').classList.add('flex');
            }, 500);
        }, 1500);

        document.getElementById('btn-deploy').addEventListener('click', () => {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');
            document.getElementById('game-hud').classList.add('flex');
            
            // Check if mobile device to show touch controls
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            } else {
                // Request pointer lock for PC
                document.body.requestPointerLock();
            }

            // Fire custom event to tell main.js to start the game
            window.dispatchEvent(new Event('gameStart'));
        });
    </script>
</body>
</html>
